name: Build Cordova Android App

on:
  push:
    branches: [ "main" ] 
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK Platforms
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova project
        # নিচের লাইনে "আপনার_অ্যাপের_নাম" এর জায়গায় আপনার আসল অ্যাপের নাম বসান
        run: cordova create app com.fastithum.app "আপনার_অ্যাপের_নাম"

      - name: Add Android platform
        working-directory: app
        run: cordova platform add android@15.1.0

      - name: Install ALL required plugins
        working-directory: app
        run: cordova plugin add cordova-plugin-file

      - name: Build APK
        working-directory: app
        run: cordova build android --debug

      - name: Find APK
        id: findapk
        run: |
          APK_PATH=$(find "$GITHUB_WORKSPACE/app/platforms/android/app/build/outputs/apk/debug" -name "*.apk" | head -n 1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.findapk.outputs.apk_path }}
